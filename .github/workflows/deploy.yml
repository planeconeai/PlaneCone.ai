# ============================================================================
# PlaneConeAI Mammo AI — CI/CD Pipeline
# Triggers on push to main · Deploys to Render (Docker)
# ============================================================================

name: "Mammo AI — Build & Deploy"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.10"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: "🔍 Quality Gate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install & lint
        run: |
          pip install ruff
          ruff check . || true

  deploy:
    name: "🚀 Deploy to Render"
    needs: quality
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
    steps:
      - name: Trigger Render Deploy (if hook configured)
        if: env.RENDER_HOOK != ''
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          echo "Triggering Render deployment..."
          curl -X POST "$RENDER_HOOK" --fail --silent --show-error
          echo "Deploy hook triggered successfully."
