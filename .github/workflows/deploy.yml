# ============================================================================
# PlaneConeAI Mammo AI — CI/CD Pipeline
# Deploys to Render (Docker)
# ============================================================================

name: "Mammo AI — Build & Deploy"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.10"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: "🔍 Quality Gate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install & lint
        run: |
          pip install ruff
          ruff check . || true

  deploy:
    name: "🚀 Deploy to Render"
    needs: quality
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://planeconeai-mammo-ai.onrender.com
    steps:
      - name: Trigger Render Deploy
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" \
            --fail --silent --show-error

      - name: Wait & verify health
        run: |
          echo "⏳ Waiting 120s for Docker build + model loading..."
          sleep 120
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://planeconeai-mammo-ai.onrender.com/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Mammo AI is healthy!"
              exit 0
            fi
            echo "  Attempt $i/12 — status=$STATUS, retrying in 20s..."
            sleep 20
          done
          echo "⚠️ Mammo AI may still be loading models — check Render dashboard"
