# ============================================================================
# PlaneConeAI Mammo AI — CI/CD Pipeline
# Python/FastAPI · CPU-only PyTorch · Longer build times expected
# ============================================================================

name: "Mammo AI — Build & Deploy"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKER_IMAGE: ghcr.io/${{ github.repository_owner }}/planeconeai-mammo-ai
  PYTHON_VERSION: "3.10"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  quality:
    name: "🔍 Quality Gate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check . || true

      - name: Run tests
        run: |
          pip install pytest
          pytest tests/ -v --tb=short || true

  build:
    name: "🐳 Build & Push"
    needs: quality
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Mammo AI builds can be slow due to PyTorch wheels
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

  scan:
    name: "🛡️ Security Scan"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:latest
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  deploy:
    name: "🚀 Deploy to Production"
    needs: [build, scan]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://planeconeai-mammo-ai.onrender.com
    steps:
      - name: Deploy to Render
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_MAMMO_AI }}" \
            -H "Content-Type: application/json" \
            --fail --silent --show-error

      - name: Verify deployment
        run: |
          echo "⏳ Waiting 90s for model loading..."
          sleep 90
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://planeconeai-mammo-ai.onrender.com/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Mammo AI is healthy!"
              exit 0
            fi
            echo "  Attempt $i/12 — status=$STATUS, retrying in 20s..."
            sleep 20
          done
          echo "❌ Mammo AI health check failed"
          exit 1
