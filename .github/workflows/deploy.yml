# ============================================================================
# PlaneConeAI Mammo AI — CI/CD Pipeline
# Triggers on push to main · Deploys to Oracle Cloud ARM64 VM (Docker Compose)
# ============================================================================

name: "Mammo AI — Build & Deploy"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.10"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: "🔍 Quality Gate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install & lint
        run: |
          pip install ruff
          ruff check . || true

  deploy:
    name: "🚀 Deploy to Oracle Cloud VM"
    needs: quality
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
    steps:
      - name: Deploy via SSH to Oracle VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME || 'ubuntu' }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "📥 Pulling latest Mammo-AI changes..."
            cd /home/ubuntu/planeconeai/planeconeai-mammo-ai || cd /home/ubuntu/PlaneCone.ai/planeconeai-mammo-ai
            git pull origin main

            echo "🐳 Rebuilding and restarting Mammo-AI container..."
            cd ..
            docker compose up -d --no-deps --build mammo-ai

            echo "⏳ Verifying Mammo-AI health..."
            sleep 25
            for i in $(seq 1 12); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "✅ Mammo-AI is healthy and running on Oracle VM!"
                exit 0
              fi
              echo "  Attempt $i/12 — status=$STATUS, retrying in 10s..."
              sleep 10
            done
            echo "⚠️ Mammo-AI health check timed out. Checking container logs:"
            docker compose logs --tail=50 mammo-ai
            exit 1
